services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mini_adex
      POSTGRES_USER: mini_adex
      POSTGRES_PASSWORD: mini_adex
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_adex -d mini_adex"]
      interval: 2s
      timeout: 2s
      retries: 10


  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://mini_adex:mini_adex@postgres:5432/mini_adex?sslmode=disable",
        "up"
      ]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://mini_adex:mini_adex@postgres:5432/mini_adex?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully